# Render blueprint. One service: the API and the SPA are the same process.
#
# Every secret is declared `sync: false`, which means Render asks for the value
# in its dashboard and never reads it from this file. Nothing here is a secret,
# and nothing here should ever become one — this file is committed.
#
# The database is deliberately *not* declared. Render's own free Postgres
# expires 30 days after it is created; Neon's free tier does not expire at all.
# So DATABASE_URL points at Neon and is entered by hand.

services:
  - type: web
    name: prizma
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Cheap, unauthenticated, and touches no database — which is what a health
    # check should be. Anything heavier turns a slow query into a restart loop.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # ---------------------------------------------------------- deployment
      - key: PUBLIC_MODE
        value: "1"
      # JSON, not a bare string: these are list fields, and pydantic-settings
      # parses list-typed environment variables as JSON. `ALLOWED_HOSTS=prizma
      # .onrender.com` would fail to parse and the app would not start.
      - key: ALLOWED_HOSTS
        value: '["prizma.onrender.com"]'
      - key: PUBLIC_BASE_URL
        value: https://prizma.onrender.com
      # Same origin as the API, because this process serves the SPA too.
      - key: FRONTEND_URL
        value: https://prizma.onrender.com
      # No separate frontend origin in this deployment. Left explicitly empty
      # rather than omitted: the local default is localhost:5173, and shipping
      # that to production would allow a page on the visitor's own machine to
      # drive the deployed API.
      - key: CORS_ORIGINS
        value: "[]"

      # -------------------------------------------------------------- secrets
      # Generated by `python scripts/gen_secret.py` and pasted into Render.
      # Losing it means every stored provider key becomes undecryptable.
      - key: SECRET_KEY
        sync: false
      # Neon: postgresql+psycopg://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ------------------------------------------------------------ identity
      # Only this address may claim the single account. Without it the first
      # stranger to find the URL owns the app.
      - key: OWNER_EMAIL
        sync: false
      # Set to "0" once Google or e-mail sign-in works, to close the 4-digit
      # code path on a public URL entirely.
      - key: PASSCODE_LOGIN_ENABLED
        value: "1"

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # `config.py` reads these two providers as well. Left commented rather
      # than omitted: an unset pair simply hides that button, and a variable
      # the code reads but the deploy file never mentions is how drift starts.
      # - key: MICROSOFT_CLIENT_ID
      #   sync: false
      # - key: MICROSOFT_CLIENT_SECRET
      #   sync: false
      # - key: APPLE_CLIENT_ID
      #   sync: false
      # - key: APPLE_CLIENT_SECRET
      #   sync: false

      # ---------------------------------------------------------------- mail
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Prizma <onboarding@resend.dev>

      # ------------------------------------------------------------- contact
      # Wikimedia returns 403 to a User-Agent with no contact URL, so the
      # keyless Wikipedia search is skipped while this is empty.
      - key: CONTACT_URL
        sync: false
