# Declared explicitly rather than left to pip's legacy fallback: the Docker
# build installs this package with no network-resolved defaults to fall back on,
# and an implicit build backend is the kind of thing that works locally and
# fails once, in a build log, on a Sunday.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-backend"
version = "0.1.0"
description = "Local multiagent chat backend: BYOK router across free LLM provider APIs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "litellm>=1.55,!=1.107.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    # Postgres (Neon). `[binary]` ships the compiled libpq so the Docker image
    # needs no build toolchain and no `libpq-dev`.
    "psycopg[binary]>=3.2",
    # AES-256-GCM for provider keys at rest. Replaces `keyring`, which has no
    # working backend inside a Linux container — every read there either raises
    # or quietly returns None, which would look exactly like "no key set".
    "cryptography>=44.0",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite rewrites the environment before importing anything from `app`
# (see tests/conftest.py); an import from the repo root would load the
# developer's own .env first and point the tests at the real database.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
