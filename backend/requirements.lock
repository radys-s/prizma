# Version constraints for the Docker image. NOT a full requirements file.
#
# Why this exists: `pyproject.toml` has only lower bounds, `render.yaml` has
# `autoDeployTrigger: commit`, and litellm — which every provider call goes
# through — ships breaking changes often. Without a pin, a README typo could
# redeploy the app onto a litellm that no longer speaks to Groq.
#
# It is a *constraints* file (`pip install -c`), not a requirements list, on
# purpose: it was compiled from the working Windows venv on 2026-09-07,
# so it cannot carry the Linux-only wheels the image legitimately wants
# (uvloop, httptools). As constraints it caps versions of whatever pip
# installs and stays out of the way of platform-specific extras.
#
# To refresh after changing a dependency:
#   backend/.venv/Scripts/python -m pip freeze --exclude-editable
# then drop the dev-only lines (pytest, pluggy, iniconfig) and the
# Windows-only ones (pywin32-ctypes, colorama).
