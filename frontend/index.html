<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the app paint under the notch and the home
         indicator; `index.css` then pads the chrome back out with
         `env(safe-area-inset-*)` so nothing lands under them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f0eee6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Prizma — lokální router mezi free-tier LLM providery. Jeden prompt, ten správný model."
    />
    <!-- Referrer never leaves this machine anyway; saying so costs nothing. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Znak v dlaždici, inlinovaný, aby si ikona záložky neřekla o další
         request. Dlaždice tu je schválně: samotný obrys by na světlém i
         tmavém panelu záložek pokaždé sedl na jinou barvu pozadí, kdežto
         dlaždice vypadá všude stejně — a shodně s ikonou na ploše.
         Geometrie je táž jako v `src/components/Logo.tsx`; ta je zdroj
         pravdy, tohle a `scripts/make-icons.mjs` ji kopírují ručně. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='4' y1='34' x2='36' y2='6' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%235d9fd6'/%3E%3Cstop offset='.27' stop-color='%23a86fc4'/%3E%3Cstop offset='.52' stop-color='%23d9635a'/%3E%3Cstop offset='.76' stop-color='%23e59356'/%3E%3Cstop offset='1' stop-color='%23f2c879'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='8.8' fill='%231f1e1d'/%3E%3Cg transform='translate(7.6 7.6) scale(.62)'%3E%3Cpath d='M20 6.6 33.4 30.4H6.6Z' fill='%23f0eee6' fill-opacity='.12'/%3E%3Cpath d='M2.4 24H18L37 11' stroke='%23f0eee6' stroke-width='3.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20 6.6 33.4 30.4H6.6Z' stroke='url(%23s)' stroke-width='4' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E" />
    <title>Prizma</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS reads none of the manifest: the home-screen icon, the
         standalone launch and the status bar each need their own tag. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Prizma" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Applies a *forced* theme before the first paint. Without this, a user
         who picked light on a dark OS would see one dark frame on every load,
         which is the single most obvious "unfinished app" tell there is.
         "System" needs nothing here: tokens.css does that in CSS alone. -->
    <script>
      try {
        var t = localStorage.getItem("prizma.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]:not([media])');
          if (!m) {
            m = document.createElement("meta");
            m.name = "theme-color";
            document.head.appendChild(m);
          }
          m.content = t === "light" ? "#f0eee6" : "#1f1e1d";
        }
      } catch (e) {
        /* Private mode or blocked storage — the OS preference still applies. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
